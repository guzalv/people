services:
  people:
    image: ghcr.io/guzalv/people:latest
    pull_policy: always
    container_name: people
    ports:
      # Host port configurable so it doesn't collide with other services on a
      # shared box; defaults to 8080. Override via .env: PEOPLE_PORT=8123
      - "${PEOPLE_PORT:-8080}:8080"
    environment:
      # Required: the app refuses requests (503) without it. Put it in .env
      # (gitignored) next to this file.
      PEOPLE_PASSWORD: ${PEOPLE_PASSWORD:?set PEOPLE_PASSWORD in .env}
    volumes:
      # Keep the SQLite file as a plain file in ./data on the host so it's easy
      # to back up (scripts/backup.sh) — the container writes /data/people.db.
      - ./data:/data
    restart: unless-stopped

    # If this host fronts services with a reverse proxy (traefik, nginx-proxy,
    # caddy-docker-proxy), drop the `ports:` mapping above and instead attach
    # this service to that proxy's shared network + add its labels, e.g.:
    #
    # networks:
    #   - proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.people.rule=Host(`people.example.com`)"
    #   - "traefik.http.services.people.loadbalancer.server.port=8080"
    #
    # networks:
    #   proxy:
    #     external: true
