services:
  people:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Required: the app refuses requests (503) without it. Put it in .env
      # (gitignored) next to this file.
      PEOPLE_PASSWORD: ${PEOPLE_PASSWORD:?set PEOPLE_PASSWORD in .env}
    volumes:
      # Keep the SQLite file as a plain file in ./data on the host so it's easy
      # to back up (scripts/backup.sh) — the container writes /data/people.db.
      - ./data:/data
    restart: unless-stopped
